name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,serve]" tokenizers
      - name: Lint
        run: |
          # hard-fail on real errors (syntax, undefined names); style stays advisory
          ruff check packages/ scripts/ --select E9,F63,F7,F82
          ruff check packages/ scripts/ || true
          # tests are local-only (never uploaded to git)
          if [ -d tests ]; then
            ruff check tests/ --select E9,F63,F7,F82
            ruff check tests/ || true
          fi
      - name: Test
        run: |
          # tests/ is kept out of git — local-only suite; CI skips when absent
          if [ -d tests ]; then
            PYTHONPATH=packages pytest tests/ -v --tb=short
          else
            echo "tests/ not in repo — local-only suite skipped"
          fi

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t neurofield:ci -f deploy/docker/Dockerfile .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependency audit (advisory)
        run: |
          pip install pip-audit
          pip-audit -r <(python - <<'PY'
          import tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))["project"]
          print("\n".join(d.get("dependencies", [])))
          PY
          ) || true

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,serve]" tokenizers
      - name: Lint
        run: |
          # hard-fail on real errors (syntax, undefined names); style stays advisory
          ruff check src/ tests/ scripts/ --select E9,F63,F7,F82
          ruff check src/ tests/ scripts/ || true
      - name: Test
        run: PYTHONPATH=src pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t neurofield:ci -f deploy/docker/Dockerfile .

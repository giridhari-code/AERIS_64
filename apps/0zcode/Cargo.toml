[package]
name = "zeroz"
version = "1.3.7"
edition = "2021"
rust-version = "1.74"
description = "0z code — company-standard non-coding agent (terminal)"
authors = ["Giridhari Karmakar <giriisdev@gmail.com>"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "0zcode"
path = "src/main.rs"

[lib]
name = "zeroz"
path = "src/lib.rs"

[dependencies]
# std-only TUI (term / editor / repl / tui) — no external crates required

[profile.release]
lto = true
codegen-units = 1
strip = true

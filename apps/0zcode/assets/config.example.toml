# Copy to ~/.config/0zcode/config.toml
# Env vars override these values (ZEROZ_*).

http_timeout_secs = 12
max_output_chars = 8000
color = true
offline = false
history_size = 40

# Shown in the Claude Code-style header (model line)
model_label = "AERIS-64 · tools-first"

# ── AERIS-64 / SENTINEL LLM link ─────────────────────────────────────────
# Anything no tool can answer (chat, questions, Hinglish…) goes to the model.
# Only host:port matter; any path is ignored. http:// only (no TLS in this binary).
# Start the server:  scripts/zeroz/run_aeris.sh
#   or: uvicorn "sentinel.api.app:create_app" --factory --port 8000
aeris_url = "http://127.0.0.1:8000"

# Only if the server runs with NEUROFIELD_API_KEYS (sent as X-API-Key).
# aeris_key = ""

aeris_stream = true          # live tokens (/v1/chat/stream); false = one reply (/v1/chat)
aeris_max_tokens = 256       # server caps at 8192
aeris_timeout_secs = 60      # give up after this long with no data

# user_agent = "0zcode/1.3"

# 0zcode — user MCP endpoints
# Path: ~/.config/0zcode/mcp_tools.conf  (override: ZEROZ_MCP_CONFIG)
#
# Columns:
#   id | keyword,keyword | endpoint_url [| mcp-v2 [| remote_tool_name]]
#
# mcp-v2  → JSON-RPC 2.0 methods tools/list and tools/call (POST application/json)
# (omit)  → legacy HTTP GET with query parameters q and text
#
# Examples:
# status | status,health,ops | https://mcp.internal.example/v1 | mcp-v2 | status_report
# mail   | email,inbox       | https://workers.example/mail/today

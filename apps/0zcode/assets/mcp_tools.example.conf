# 0zcode user MCP tools — copy to ~/.config/0zcode/mcp_tools.conf
# Format:  name | trigger1,trigger2 | https://your-endpoint
#
# Endpoint should accept GET ?q=... and return plain text or JSON:
#   { "summary": "3 unread emails..." }
#
# Example:
# email | email,inbox,mail,e-mail | https://your-worker.example/email/today
# calendar | calendar,meeting,agenda | https://your-worker.example/calendar/today

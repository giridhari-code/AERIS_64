<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0f" />
  <meta name="description" content="SENTINEL — local research model chat" />
  <title>SENTINEL</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <style>
    :root {
      --bg: #0b0c0f;
      --surface: #12141a;
      --surface-elevated: #181b24;
      --border: #2a2f3d;
      --border-subtle: #1e222d;
      --text: #f0f2f5;
      --text-secondary: #9aa3b2;
      --accent: #6b8cff;
      --accent-hover: #8aa4ff;
      --accent-soft: rgba(107, 140, 255, 0.12);
      --user: #1a2235;
      --assistant: #141820;
      --success: #3dd68c;
      --danger: #ff6b7a;
      --radius: 12px;
      --radius-lg: 16px;
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --shadow: 0 8px 32px rgba(0,0,0,0.35);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --header-h: 56px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    /* Top bar */
    .topbar {
      height: var(--header-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: rgba(18, 20, 26, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 20;
    }
    .brand {
      display: flex; align-items: center; gap: 10px; min-width: 0;
    }
    .brand img {
      width: 28px; height: 28px; border-radius: 8px;
    }
    .brand-text { min-width: 0; }
    .brand-text strong {
      display: block; font-size: 0.9rem; font-weight: 600;
      letter-spacing: 0.04em;
    }
    .brand-text span {
      font-size: 0.68rem; color: var(--text-secondary);
    }
    .nav {
      display: flex; align-items: center; gap: 4px; margin-left: 8px;
    }
    .nav a, .nav button {
      font-size: 0.78rem; color: var(--text-secondary);
      background: transparent; border: none; cursor: pointer;
      padding: 6px 10px; border-radius: 8px;
    }
    .nav a:hover, .nav button:hover {
      color: var(--text); background: var(--accent-soft);
    }
    .topbar-right {
      margin-left: auto; display: flex; align-items: center; gap: 8px;
    }
    .status {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: var(--text-secondary);
      background: var(--surface-elevated);
      border: 1px solid var(--border-subtle);
      padding: 4px 10px; border-radius: 999px;
    }
    .status .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-secondary);
    }
    .status.ok .dot { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status.err .dot { background: var(--danger); }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-secondary); cursor: pointer;
      display: grid; place-items: center; font-size: 1rem;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); }

    /* Main */
    #chat {
      flex: 1; overflow-y: auto;
      padding: 24px 16px 12px;
      scroll-behavior: smooth;
    }
    .thread {
      max-width: 720px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 16px;
    }
    .msg {
      display: flex; flex-direction: column; gap: 6px;
      max-width: 92%;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .msg .role {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-secondary);
      padding: 0 4px;
    }
    .msg.user .role { color: var(--accent); }
    .msg .bubble {
      padding: 12px 14px; border-radius: var(--radius-lg);
      line-height: 1.55; font-size: 0.95rem;
      white-space: pre-wrap; word-break: break-word;
      border: 1px solid var(--border-subtle);
    }
    .msg.user .bubble {
      background: var(--user);
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: var(--assistant);
      border-bottom-left-radius: 4px;
    }
    .msg .meta {
      font-size: 0.68rem; color: var(--text-secondary); padding: 0 4px;
    }
    .msg .actions {
      display: flex; gap: 6px; opacity: 0.5; transition: opacity 0.15s;
    }
    .msg.assistant:hover .actions { opacity: 1; }
    .msg .actions button {
      font-size: 0.65rem; padding: 2px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-secondary); cursor: pointer;
    }
    .msg .actions button:hover { color: var(--text); border-color: var(--accent); }

    /* Welcome */
    .welcome {
      max-width: 520px; margin: auto; text-align: center;
      padding: 48px 16px; color: var(--text-secondary);
    }
    .welcome h2 {
      color: var(--text); font-size: 1.35rem; font-weight: 600;
      margin-bottom: 8px; letter-spacing: -0.02em;
    }
    .welcome p { font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
    .chips {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    }
    .chip {
      font-size: 0.8rem; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); cursor: pointer; transition: 0.15s;
    }
    .chip:hover {
      border-color: var(--accent); background: var(--accent-soft);
    }

    .typing {
      display: inline-flex; gap: 5px; padding: 4px 0;
    }
    .typing i {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-secondary);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    /* Composer */
    .composer-wrap {
      flex-shrink: 0;
      border-top: 1px solid var(--border-subtle);
      background: var(--surface);
      padding: 12px 16px calc(14px + var(--safe-b));
    }
    .composer-inner { max-width: 720px; margin: 0 auto; }
    .composer {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 8px 8px 8px 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    #prompt {
      flex: 1; border: none; outline: none; background: transparent;
      color: var(--text); font: inherit; font-size: 0.95rem;
      line-height: 1.45; max-height: 160px; min-height: 24px;
      padding: 8px 0; resize: none;
    }
    #prompt::placeholder { color: var(--text-secondary); }
    .send {
      width: 40px; height: 40px; border-radius: 12px; border: none;
      background: var(--accent); color: #0b0c0f;
      font-weight: 700; font-size: 1.1rem; cursor: pointer;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .send:disabled { opacity: 0.4; cursor: not-allowed; }
    .send:not(:disabled):hover { background: var(--accent-hover); }
    .toolbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-top: 10px; padding: 0 4px;
      font-size: 0.72rem; color: var(--text-secondary);
    }
    .toolbar label {
      display: flex; align-items: center; gap: 5px; cursor: pointer;
    }
    .toolbar input[type="number"] {
      width: 52px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 3px 6px;
      font-size: 0.72rem;
    }
    .toolbar input[type="checkbox"] { accent-color: var(--accent); }
    .toolbar .spacer { flex: 1; }
    .toolbar .link {
      background: none; border: none; color: var(--text-secondary);
      cursor: pointer; font-size: 0.72rem; text-decoration: underline;
      text-underline-offset: 2px;
    }
    .toolbar .link:hover { color: var(--text); }
    .disclaimer {
      text-align: center; font-size: 0.65rem; color: var(--text-secondary);
      margin-top: 8px; opacity: 0.8;
    }

    @media (max-width: 640px) {
      .nav { display: none; }
      .msg { max-width: 96%; }
      .welcome h2 { font-size: 1.15rem; }
    }
  
    /* Buddy float — below navbar, NOT inside chat/chart */
#buddy-float {
      position: fixed;
      top: calc(var(--header-h, 56px) + 10px);
      right: 14px;
      z-index: 40;
      width: auto;
      max-width: min(180px, 40vw);
      pointer-events: auto;
      display: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.2;
      color: var(--text, #e2e8f0);
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
      animation: buddy-bob 3.2s ease-in-out infinite;
      user-select: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    }
    #buddy-float.open { display: block; }
    #buddy-float .buddy-ascii {
      white-space: pre;
      margin: 2px 0 0;
      min-height: 3.2em;
      transition: opacity 0.25s ease;
    }
    #buddy-float .buddy-meta {
      font-size: 10px;
      color: var(--muted, #94a3b8);
      margin: 0;
      word-break: break-word;
      opacity: 0.9;
    }

    #buddy-float .buddy-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    #buddy-float button {
      font: inherit;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(148,163,184,0.4);
      background: rgba(30,41,59,0.9);
      color: inherit;
      cursor: pointer;
    }
    #buddy-float button:hover { border-color: #2dd4bf; }
    #buddy-float.petting {
      animation: buddy-pet 0.55s ease;
    }
    @keyframes buddy-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
    @keyframes buddy-pet {
      0% { transform: scale(1) rotate(0deg); }
      30% { transform: scale(1.06) rotate(-3deg); }
      60% { transform: scale(1.04) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    @media (max-width: 640px) {
      #buddy-float {
        right: 8px;
        left: auto;
        width: min(160px, 48vw);
        font-size: 10px;
      }
    }

  
    #buddy-float.anim-float { animation: buddy-bob 2.4s ease-in-out infinite; }
    #buddy-float.anim-talk { animation: buddy-talk-shake 0.4s ease-in-out infinite; }
    #buddy-float.anim-think { animation: buddy-think-pulse 2s ease-in-out infinite; }
    #buddy-float.anim-happy { animation: buddy-happy 0.7s ease-in-out infinite; }
    #buddy-float.anim-sleep { animation: buddy-sleep 3s ease-in-out infinite; opacity: 0.85; }
    #buddy-float.anim-excited { animation: buddy-excited 0.35s linear infinite; }
    #buddy-float.anim-wave { animation: buddy-wave 0.8s ease-in-out infinite; }
    #buddy-float.anim-pet { animation: buddy-pet 0.55s ease; }
    @keyframes buddy-talk-shake {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(2px) scale(1.02); }
    }
    @keyframes buddy-think-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.15); }
    }
    @keyframes buddy-happy {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.05); }
    }
    @keyframes buddy-sleep {
      0%, 100% { transform: translateY(2px); }
      50% { transform: translateY(5px); }
    }
    @keyframes buddy-excited {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes buddy-wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-6deg); }
      75% { transform: rotate(6deg); }
    }
    #buddy-float .buddy-actions button.anim-btn {
      opacity: 0.85;
      font-size: 9px;
      padding: 3px 6px;
    }
    #buddy-float .buddy-actions button.anim-btn.active {
      border-color: #2dd4bf;
      color: #2dd4bf;
    }
    #buddy-mood {
      font-size: 9px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

  </style>
</head>
<body>
  <header class="topbar" role="banner">
    <div class="brand">
      <img src="/logo.svg" alt="" width="28" height="28" />
      <div class="brand-text">
        <strong>SENTINEL</strong>
        <span>Research model · local</span>
      </div>
    </div>
    <nav class="nav" aria-label="Primary">
      <a href="/">Chat</a>
      <a href="/product">Product</a>
    </nav>
    <div class="topbar-right">
      <div id="status" class="status" title="Backend health">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">…</span>
      </div>
      <button type="button" class="icon-btn" id="btnBuddy" title="Buddy on/off" aria-label="Toggle Buddy" aria-pressed="false">◉</button>
      <button type="button" class="icon-btn" id="btnNew" title="New chat" aria-label="New chat">↻</button>
    </div>
  </header>

  <main id="chat" role="log" aria-live="polite" aria-relevant="additions">
    <div class="thread" id="thread">
      <div class="welcome" id="welcome">
        <h2>SENTINEL</h2>
        <p>Local research assistant. Quality depends on your checkpoint and data — not a frontier product.</p>
        <div class="chips">
          <button type="button" class="chip" data-q="Who are you?">Who are you?</button>
          <button type="button" class="chip" data-q="calculate 12*12">Calculate 12×12</button>
          <button type="button" class="chip" data-q="what time is it">What time is it?</button>
          <button type="button" class="chip" data-q="Namaste">Namaste</button>
        </div>
      </div>
    </div>
  </main>

  
  <footer class="composer-wrap">
    <div class="composer-inner">
      <form id="form" class="composer" autocomplete="off">
        <textarea id="prompt" rows="1" placeholder="Message SENTINEL…" aria-label="Message"></textarea>
        <button type="submit" class="send" id="send" title="Send" aria-label="Send">↑</button>
      </form>
      <div class="toolbar">
        <label title="Max new tokens">max
          <input type="number" id="maxTok" min="8" max="2048" value="64" />
        </label>
        <label title="Temperature">temp
          <input type="number" id="temp" min="0" max="2" step="0.1" value="0.4" />
        </label>
        <label title="Server auto length">
          <input type="checkbox" id="autoLen" checked /> auto
        </label>
        <span class="spacer"></span>
        <span id="latency"></span>
        <button type="button" class="link" id="btnClear">Clear</button>
      </div>
      <p class="disclaimer">May produce inaccurate or nonsensical text. Verify important facts.</p>
    </div>
  </footer>

    <aside id="buddy-float" aria-label="Buddy companion" aria-hidden="true" title="Double-click to hide">
    <div class="buddy-meta" id="buddyMeta"></div>
    <div class="buddy-ascii" id="buddyAscii"></div>
  </aside>

  <script>
    const thread = document.getElementById("thread");
    const chat = document.getElementById("chat");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const latencyEl = document.getElementById("latency");
    const welcome = document.getElementById("welcome");
    const form = document.getElementById("form");

    let sessionId = localStorage.getItem("sentinel_session") || null;
    let busy = false;

    try {
      const s = JSON.parse(localStorage.getItem("sentinel_ui") || "{}");
      if (s.maxTok) document.getElementById("maxTok").value = s.maxTok;
      if (s.temp != null) document.getElementById("temp").value = s.temp;
      if (s.autoLen != null) document.getElementById("autoLen").checked = !!s.autoLen;
    } catch (_) {}

    function saveSettings() {
      localStorage.setItem("sentinel_ui", JSON.stringify({
        maxTok: document.getElementById("maxTok").value,
        temp: document.getElementById("temp").value,
        autoLen: document.getElementById("autoLen").checked,
      }));
    }
    ["maxTok", "temp", "autoLen"].forEach((id) => {
      document.getElementById(id).addEventListener("change", saveSettings);
    });

    function hideWelcome() {
      if (welcome) welcome.style.display = "none";
    }

    function fmtMs(ms) {
      if (ms == null || Number.isNaN(ms)) return "";
      if (ms < 1000) return Math.round(ms) + " ms";
      return (ms / 1000).toFixed(1) + " s";
    }

    function addMessage(role, text, meta) {
      hideWelcome();
      const msg = document.createElement("article");
      msg.className = "msg " + (role === "user" ? "user" : "assistant");
      const roleEl = document.createElement("div");
      roleEl.className = "role";
      roleEl.textContent = role === "user" ? "You" : "SENTINEL";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      msg.appendChild(roleEl);
      msg.appendChild(bubble);
      if (role !== "user" && text && !String(text).startsWith("Error")) {
        const actions = document.createElement("div");
        actions.className = "actions";
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.textContent = "Copy";
        copyBtn.onclick = async () => {
          try {
            await navigator.clipboard.writeText(text);
            copyBtn.textContent = "Copied";
            setTimeout(() => { copyBtn.textContent = "Copy"; }, 1200);
          } catch (_) {}
        };
        actions.appendChild(copyBtn);
        msg.appendChild(actions);
      }
      if (meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta;
        msg.appendChild(m);
      }
      thread.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      return msg;
    }

    function setBusy(v) {
      busy = v;
      sendBtn.disabled = v;
      promptEl.disabled = v;
    }

    function autoGrow() {
      promptEl.style.height = "auto";
      promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + "px";
    }
    promptEl.addEventListener("input", autoGrow);

    async function checkHealth() {
      try {
        const r = await fetch("/readyz");
        if (!r.ok) throw new Error();
        statusEl.classList.add("ok");
        statusEl.classList.remove("err");
        let label = "online";
        try {
          const j = await r.json();
          if (j.model) label = j.model;
          else if (j.python && j.python.model) label = j.python.model;
          else if (j.status) label = j.status;
        } catch (_) {}
        statusText.textContent = label;
      } catch {
        statusEl.classList.remove("ok");
        statusEl.classList.add("err");
        statusText.textContent = "offline";
      }
    }
    checkHealth();
    setInterval(checkHealth, 30000);

    async function send(text) {
      
      const q = (text != null ? text : promptEl.value).trim();
      if (!q || busy) return;
      promptEl.value = "";
      autoGrow();
      addMessage("user", q);
      setBusy(true);
      saveSettings();

      const typing = document.createElement("article");
      typing.className = "msg assistant";
      typing.id = "typing";
      typing.innerHTML = '<div class="role">SENTINEL</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
      thread.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;
      try { if (window.sentinelBuddyReact) window.sentinelBuddyReact(q, "user"); } catch (_) {}


      const maxTok = parseInt(document.getElementById("maxTok").value, 10) || 64;
      const temp = parseFloat(document.getElementById("temp").value);
      const auto = document.getElementById("autoLen").checked;

      try {
        const r = await fetch("/v1/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: q,
            max_new_tokens: maxTok,
            temperature: Number.isFinite(temp) ? temp : 0.4,
            auto_length: auto,
            session_id: sessionId || null,
          }),
        });
        document.getElementById("typing")?.remove();
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          let detail = err.detail;
          if (Array.isArray(detail)) detail = detail.map((d) => d.msg || JSON.stringify(d)).join("; ");
          else if (detail && typeof detail === "object") detail = JSON.stringify(detail);
          addMessage("assistant", "Error: " + (detail || r.statusText || r.status));
        } else {
          const j = await r.json();
          sessionId = j.session_id || sessionId;
          if (sessionId) localStorage.setItem("sentinel_session", sessionId);
          const lat = j.latency_ms != null ? fmtMs(j.latency_ms) : "";
          const reply = (j.text || "").trim() || "(empty reply — train with more SFT data)";
          addMessage("assistant", reply, lat ? "latency " + lat : "");
          try { if (window.sentinelBuddyReact) window.sentinelBuddyReact(reply, "assistant"); } catch (_) {}
          latencyEl.textContent = lat ? "last " + lat : "";
        }
      } catch (e) {
        document.getElementById("typing")?.remove();
        addMessage("assistant", "Network error: " + e.message);
      }
      setBusy(false);
      promptEl.focus();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      send();
    });
    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    document.querySelectorAll(".chip").forEach((ch) => {
      ch.addEventListener("click", () => send(ch.getAttribute("data-q")));
    });

    async function resetSession() {
      try {
        if (sessionId) {
          await fetch("/v1/reset?session_id=" + encodeURIComponent(sessionId), { method: "POST" });
        }
      } catch (_) {}
      sessionId = null;
      localStorage.removeItem("sentinel_session");
      thread.innerHTML = "";
      if (welcome) {
        thread.appendChild(welcome);
        welcome.style.display = "";
      }
      latencyEl.textContent = "";
    }
    document.getElementById("btnNew").addEventListener("click", resetSession);
    document.getElementById("btnClear").addEventListener("click", resetSession);
  


    /* ---- Buddy float: name + sprite only; mood auto from chat ---- */
    const BUDDY_KEY = "sentinel_buddy_on";
    const buddyFloat = document.getElementById("buddy-float");
    const buddyAscii = document.getElementById("buddyAscii");
    const buddyMeta = document.getElementById("buddyMeta");
    const btnBuddy = document.getElementById("btnBuddy");
    let buddyOn = localStorage.getItem(BUDDY_KEY) === "1";
    let buddyFrames = null;
    let buddyFrameIdx = 0;
    let buddyIdleTimer = null;
    let buddyAnimMap = {};
    let buddyAnimName = "idle";
    let buddyUserId = localStorage.getItem("sentinel_buddy_uid") || ("web-" + Math.random().toString(36).slice(2, 10));
    localStorage.setItem("sentinel_buddy_uid", buddyUserId);
    const CSS_ANIMS = ["float", "talk", "think", "happy", "sleep", "excited", "wave", "pet"];

    function moodFromChat(text, role) {
      const t = (text || "").toLowerCase();
      if (!t) return "idle";
      if (role === "assistant") {
        if (/sorry|error|cannot|can't|unable/.test(t)) return "think";
        if (/!|great|done|success/.test(t)) return "happy";
        return "talk";
      }
      if (/haha|lol|lmao|😂|hehe/.test(t) || (t.match(/!/g) || []).length > 1) return "happy";
      if (/\b(why|how|what|explain|kyun|kaise|think)\b/.test(t) || t.indexOf("?") >= 0) return "think";
      if (/\b(bye|good night|sleep|so ja)\b/.test(t)) return "sleep";
      if (/\b(hi|hello|hey|namaste|hola)\b/.test(t)) return "wave";
      if (/\b(wow|amazing|yay)\b/.test(t)) return "excited";
      if (/\b(pet|love|cute)\b/.test(t)) return "pet";
      if (t.length > 120) return "think";
      return "blink";
    }

    function clearBuddyCssAnim() {
      if (!buddyFloat) return;
      CSS_ANIMS.forEach(function (n) { buddyFloat.classList.remove("anim-" + n); });
      buddyFloat.classList.remove("petting");
    }

    function setBuddyAnim(name) {
      buddyAnimName = name || "idle";
      clearBuddyCssAnim();
      if (buddyFloat) {
        if (CSS_ANIMS.indexOf(buddyAnimName) >= 0) buddyFloat.classList.add("anim-" + buddyAnimName);
        else buddyFloat.classList.add("anim-float");
      }
      const frames = (buddyAnimMap && buddyAnimMap[buddyAnimName]) || buddyFrames;
      if (frames && frames.length) {
        buddyFrames = frames;
        buddyFrameIdx = 0;
        if (buddyAscii) buddyAscii.textContent = frames[0];
      }
      var speed = 700;
      if (buddyAnimName === "talk") speed = 280;
      if (buddyAnimName === "sleep") speed = 1400;
      if (buddyAnimName === "excited") speed = 320;
      startBuddyIdle(speed);
      // soft return to idle after a burst
      if (buddyAnimName !== "idle" && buddyAnimName !== "sleep") {
        setTimeout(function () {
          if (buddyOn && buddyAnimName !== "sleep") setBuddyAnim("idle");
        }, 4500);
      }
    }

    function setBuddyVisible(on) {
      buddyOn = !!on;
      localStorage.setItem(BUDDY_KEY, buddyOn ? "1" : "0");
      if (!buddyFloat) return;
      buddyFloat.classList.toggle("open", buddyOn);
      buddyFloat.setAttribute("aria-hidden", buddyOn ? "false" : "true");
      if (btnBuddy) btnBuddy.setAttribute("aria-pressed", buddyOn ? "true" : "false");
      if (buddyOn) {
        loadBuddy().then(function () { setBuddyAnim("wave"); });
      } else {
        stopBuddyIdle();
      }
    }

    function startBuddyIdle(ms) {
      stopBuddyIdle();
      var speed = ms || 700;
      buddyIdleTimer = setInterval(function () {
        if (!buddyFrames || !buddyFrames.length) return;
        buddyFrameIdx = (buddyFrameIdx + 1) % buddyFrames.length;
        if (buddyAscii) buddyAscii.textContent = buddyFrames[buddyFrameIdx];
      }, speed);
    }
    function stopBuddyIdle() {
      if (buddyIdleTimer) clearInterval(buddyIdleTimer);
      buddyIdleTimer = null;
    }

    function localBuddyFallback() {
      const art = ["  /\\_/\\  ", " ( . . ) ", "  > ^ <  "].join("\n");
      if (buddyAscii) buddyAscii.textContent = art;
      if (buddyMeta) buddyMeta.textContent = "Buddy";
      buddyFrames = [art, art.replace(".", "-")];
      buddyAnimMap = { idle: buddyFrames, blink: buddyFrames, talk: buddyFrames };
    }

    async function loadBuddy() {
      try {
        const r = await fetch("/v1/buddy", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...(window.__API_KEY ? { "X-API-Key": window.__API_KEY } : {}),
          },
          body: JSON.stringify({ command: "/buddy", user_id: buddyUserId }),
        });
        if (!r.ok) { localBuddyFallback(); return; }
        const data = await r.json();
        const b = data.buddy || {};
        if (buddyMeta) {
          buddyMeta.textContent = b.name
            ? (b.name + " · " + (b.species_name || ""))
            : "Buddy";
        }
        if (b.animations && typeof b.animations === "object") {
          buddyAnimMap = b.animations;
          buddyFrames = b.animations.idle || b.animations.blink || [];
        } else if (b.sprite_lines) {
          const art = b.sprite_lines.join("\n");
          buddyFrames = [art, art.replace(/o/, "-")];
          buddyAnimMap = { idle: buddyFrames, blink: buddyFrames };
        }
        if (buddyAscii && buddyFrames && buddyFrames[0]) buddyAscii.textContent = buddyFrames[0];
      } catch (e) {
        localBuddyFallback();
      }
    }

    /** Call from chat pipeline so buddy reacts to AERIS conversation */
    window.sentinelBuddyReact = function (text, role) {
      if (!buddyOn) return;
      setBuddyAnim(moodFromChat(text, role || "user"));
    };

    if (btnBuddy) btnBuddy.addEventListener("click", function () { setBuddyVisible(!buddyOn); });
    if (buddyFloat) {
      buddyFloat.addEventListener("dblclick", function () { setBuddyVisible(false); });
    }
    if (buddyOn) setBuddyVisible(true);

</script>
</body>
</html>

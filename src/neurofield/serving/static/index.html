<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0d10" />
  <title>AERIS_64</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
  <style>
    :root {
      --bg: #0c0d10;
      --surface: #14161c;
      --surface2: #1a1d26;
      --border: #2a2e3a;
      --border-soft: #22252f;
      --text: #eceef2;
      --muted: #8b919c;
      --accent: #7c9cff;
      --accent-dim: rgba(124, 156, 255, 0.15);
      --user-bg: #1e2433;
      --bot-bg: #151820;
      --danger: #f07178;
      --ok: #7fd99a;
      --radius: 16px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(20, 22, 28, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
      z-index: 10;
    }
    header .logo {
      width: 32px; height: 32px; border-radius: 9px;
    }
    header .titles { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    header h1 {
      font-size: 0.95rem; font-weight: 600; letter-spacing: 0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    header .sub { font-size: 0.7rem; color: var(--muted); }
    .pill {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border-soft);
      padding: 4px 10px; border-radius: 999px;
    }
    .pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
    }
    .pill.ok .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .pill.err .dot { background: var(--danger); }
    .icon-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); width: 34px; height: 34px; border-radius: 10px;
      cursor: pointer; display: grid; place-items: center;
      font-size: 1rem; line-height: 1;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); }

    /* Chat */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .msg-row {
      display: flex;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.bot { justify-content: flex-start; }
    .bubble {
      max-width: min(92%, 640px);
      padding: 12px 14px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: var(--user-bg);
      border: 1px solid #2c3548;
      border-bottom-right-radius: 6px;
    }
    .msg-row.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border-soft);
      border-bottom-left-radius: 6px;
    }
    .bubble .who {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .msg-row.user .who { color: var(--accent); }
    .meta-line {
      max-width: 720px;
      margin: -6px auto 0;
      padding: 0 4px;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .meta-line.user-side { text-align: right; }

    /* Empty / welcome */
    .welcome {
      max-width: 520px;
      margin: auto;
      text-align: center;
      padding: 24px 16px;
      color: var(--muted);
    }
    .welcome h2 {
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .welcome p { font-size: 0.88rem; line-height: 1.5; margin-bottom: 16px; }
    .chips {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    }
    .chip {
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); background: var(--accent-dim); }

    /* Typing */
    .typing {
      display: inline-flex; gap: 4px; align-items: center; padding: 4px 0;
    }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    /* Composer */
    footer {
      flex-shrink: 0;
      border-top: 1px solid var(--border-soft);
      background: var(--surface);
      padding: 10px 12px calc(12px + var(--safe-b));
    }
    .composer-wrap {
      max-width: 720px;
      margin: 0 auto;
    }
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 8px 8px 14px;
      transition: border-color 0.15s;
    }
    .composer:focus-within { border-color: var(--accent); }
    #prompt {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      line-height: 1.45;
      max-height: 140px;
      min-height: 24px;
      padding: 6px 0;
    }
    #prompt::placeholder { color: var(--muted); }
    .send-btn {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #0c0d10;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      display: grid; place-items: center;
    }
    .send-btn:disabled {
      opacity: 0.4; cursor: not-allowed;
    }
    .send-btn:not(:disabled):hover { filter: brightness(1.08); }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
      padding: 0 4px;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .toolbar label {
      display: flex; align-items: center; gap: 5px;
      cursor: pointer; user-select: none;
    }
    .toolbar input[type="number"] {
      width: 52px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 0.72rem;
    }
    .toolbar input[type="checkbox"] { accent-color: var(--accent); }
    .toolbar .spacer { flex: 1; }
    .toolbar button.link {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 0.72rem; text-decoration: underline;
      text-underline-offset: 2px;
    }
    .toolbar button.link:hover { color: var(--text); }

    @media (max-width: 480px) {
      .bubble { max-width: 95%; font-size: 0.92rem; }
      header h1 { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="/static/logo.svg" alt="" />
    <div class="titles">
      <h1>AERIS_64</h1>
      <div class="sub">NeuroField · local research model</div>
    </div>
    <div id="status" class="pill" title="API health">
      <span class="dot"></span>
      <span id="statusText">…</span>
    </div>
    <button class="icon-btn" id="btnReset" title="New chat" aria-label="New chat">↻</button>
  </header>

  <main id="chat" aria-live="polite">
    <div class="welcome" id="welcome">
      <h2>Hi — I am AERIS_64</h2>
      <p>Helpful, direct, honest about limits. Small research checkpoint — not a frontier assistant.</p>
      <div class="chips">
        <button type="button" class="chip" data-q="Who are you?">Who are you?</button>
        <button type="button" class="chip" data-q="Explain fast memory">Fast memory</button>
        <button type="button" class="chip" data-q="Write a python hello">Python hello</button>
        <button type="button" class="chip" data-q="Namaste">Namaste</button>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="prompt" rows="1" placeholder="Message AERIS_64…" autocomplete="off"></textarea>
        <button class="send-btn" id="send" title="Send" aria-label="Send">↑</button>
      </div>
      <div class="toolbar">
        <label title="Max new tokens">max
          <input type="number" id="maxTok" min="8" max="2048" value="128" />
        </label>
        <label title="Sampling temperature">temp
          <input type="number" id="temp" min="0" max="2" step="0.1" value="0.7" />
        </label>
        <label title="Let server pick length">
          <input type="checkbox" id="autoLen" checked /> auto
        </label>
        <span class="spacer"></span>
        <span id="latency"></span>
        <button type="button" class="link" id="btnClear">Clear</button>
      </div>
    </div>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const latencyEl = document.getElementById("latency");
    const welcome = document.getElementById("welcome");
    let sessionId = null;
    let busy = false;

    function hideWelcome() {
      if (welcome) welcome.style.display = "none";
    }

    function fmtMs(ms) {
      if (ms == null || Number.isNaN(ms)) return "";
      if (ms < 1000) return Math.round(ms) + " ms";
      return (ms / 1000).toFixed(1) + " s";
    }

    function addBubble(role, text, meta) {
      hideWelcome();
      const row = document.createElement("div");
      row.className = "msg-row " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = role === "user" ? "You" : "AERIS_64";
      bubble.appendChild(who);
      const body = document.createElement("div");
      body.textContent = text;
      bubble.appendChild(body);
      row.appendChild(bubble);
      chat.appendChild(row);
      if (meta) {
        const m = document.createElement("div");
        m.className = "meta-line" + (role === "user" ? " user-side" : "");
        m.textContent = meta;
        chat.appendChild(m);
      }
      chat.scrollTop = chat.scrollHeight;
      return body;
    }

    function setBusy(v) {
      busy = v;
      sendBtn.disabled = v;
      promptEl.disabled = v;
    }

    function autoGrow() {
      promptEl.style.height = "auto";
      promptEl.style.height = Math.min(promptEl.scrollHeight, 140) + "px";
    }
    promptEl.addEventListener("input", autoGrow);

    async function checkHealth() {
      try {
        const r = await fetch("/healthz");
        if (r.ok) {
          statusEl.classList.add("ok");
          statusEl.classList.remove("err");
          statusText.textContent = "online";
        } else throw new Error();
      } catch {
        statusEl.classList.remove("ok");
        statusEl.classList.add("err");
        statusText.textContent = "offline";
      }
    }
    checkHealth();
    setInterval(checkHealth, 30000);

    async function send(text) {
      const q = (text != null ? text : promptEl.value).trim();
      if (!q || busy) return;
      promptEl.value = "";
      autoGrow();
      addBubble("user", q);
      setBusy(true);

      const typingRow = document.createElement("div");
      typingRow.className = "msg-row bot";
      typingRow.id = "typing";
      typingRow.innerHTML = '<div class="bubble"><div class="who">AERIS_64</div><div class="typing"><span></span><span></span><span></span></div></div>';
      chat.appendChild(typingRow);
      chat.scrollTop = chat.scrollHeight;

      const maxTok = parseInt(document.getElementById("maxTok").value, 10) || 128;
      const temp = parseFloat(document.getElementById("temp").value);
      const auto = document.getElementById("autoLen").checked;

      try {
        const body = {
          message: q,
          max_tokens: maxTok,
          temperature: Number.isFinite(temp) ? temp : 0.7,
          auto_length: auto,
          session_id: sessionId,
        };
        const r = await fetch("/v1/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        document.getElementById("typing")?.remove();
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          addBubble("bot", "Error: " + (err.detail || r.statusText || r.status));
        } else {
          const j = await r.json();
          sessionId = j.session_id || sessionId;
          const lat = j.latency_ms != null ? fmtMs(j.latency_ms) : "";
          addBubble("bot", j.text || "(empty)", lat ? "latency " + lat : "");
          latencyEl.textContent = lat ? "last " + lat : "";
        }
      } catch (e) {
        document.getElementById("typing")?.remove();
        addBubble("bot", "Network error: " + e.message);
      }
      setBusy(false);
      promptEl.focus();
    }

    sendBtn.onclick = () => send();
    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    document.querySelectorAll(".chip").forEach((c) => {
      c.onclick = () => send(c.getAttribute("data-q"));
    });

    async function resetSession() {
      if (sessionId) {
        try {
          await fetch("/v1/reset?session_id=" + encodeURIComponent(sessionId), { method: "POST" });
        } catch (_) {}
      }
      sessionId = null;
      chat.innerHTML = "";
      // restore welcome
      const w = document.createElement("div");
      w.className = "welcome";
      w.id = "welcome";
      w.innerHTML = document.getElementById("welcome")
        ? ""
        : "";
      // re-inject welcome markup
      chat.innerHTML = `
        <div class="welcome" id="welcome">
          <h2>Hi — I am AERIS_64</h2>
          <p>Helpful, direct, honest about limits. Small research checkpoint — not a frontier assistant.</p>
          <div class="chips">
            <button type="button" class="chip" data-q="Who are you?">Who are you?</button>
            <button type="button" class="chip" data-q="Explain fast memory">Fast memory</button>
            <button type="button" class="chip" data-q="Write a python hello">Python hello</button>
            <button type="button" class="chip" data-q="Namaste">Namaste</button>
          </div>
        </div>`;
      document.querySelectorAll(".chip").forEach((c) => {
        c.onclick = () => send(c.getAttribute("data-q"));
      });
      latencyEl.textContent = "";
    }
    document.getElementById("btnReset").onclick = resetSession;
    document.getElementById("btnClear").onclick = resetSession;
  </script>
</body>
</html>

# SENTINEL default configuration (production)
# All values are overridable via CLI or environment.

model:
  d_model: 256
  d_k: 64
  d_v: 64
  n_skills: 8
  top_k: 2
  k_max: 5
  dendrite_window: 3
  vocab_size: 32000          # change to 65 for char-level
  max_seq_len: 3072
  tie_embeddings: true
  dropout: 0.0

training:
  batch_size: 8
  seq_len: 256
  lr: 5.0e-4                  # was 1e-3 — safer with memory + error loss
  weight_decay: 0.01
  warmup_steps: 200
  max_steps: 100000
  grad_clip: 1.0
  lambda_err: 0.1
  lambda_err_warmup_steps: 2000  # ramp error loss to avoid early embedding collapse
  lambda_bal: 0.01
  replay_every: 75
  replay_eta: 0.02
  truncate_write_window: 24   # truncated BPTT for fast write
  memory_lr_scale: 0.5        # lower LR for fast/slow mem + neuromod
  ema_decay: 0.999            # EMA weights for eval (0 = off)
  device: "cuda"
  seed: 42
  log_every: 50
  eval_every: 500
  checkpoint_every: 2000
  output_dir: "runs/sentinel_v2"
  precision: "bf16"           # bf16 when CUDA available

data:
  train_path: null            # path to tokenized .bin or .npy
  val_path: null
  tokenizer: "byte"           # "byte" | "hf" | "char"
  hf_tokenizer_name: null

safety:
  enable_audit: true
  max_write_norm: 10.0
  max_memory_norm: 50.0
  gate_cap: 1.0
  gate_floor: 0.05            # train-time min write gate (anti-collapse)
  gate_target: 0.35
  lambda_gate: 0.01
  lambda_ent: 0.005
  anomaly_z_threshold: 4.0
  freeze_on_anomaly: false
  per_session_state: true
  truncate_write_window: 24

logging:
  level: "INFO"
  wandb: false
  wandb_project: "neurofield-v2"

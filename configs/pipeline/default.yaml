# Pair with --config configs/aeris_109m.yaml (or configs/default.yaml)
# Company multi-stage training pipeline
# All data paths come from CLI flags or your own overlays — none are hardcoded here.
#
#   PYTHONPATH=packages python -m sentinel.cli pipeline \
#     --pipeline-config configs/pipeline/default.yaml \
#     --config configs/default.yaml \
#     --data-dir /path/to/tokens \
#     --sft-data /path/to/sft.jsonl \
#     --prefs /path/to/preferences.jsonl \
#     --tokenizer-json /path/to/tokens/tokenizer.json \
#     --output-dir runs/pipeline

stages:
  - pretrain
  - midtrain
  - long_context
  - sft
  - reasoning
  - preference_bt
  - dpo
  - orpo
  - lora_pref
  - grpo
  - rlhf_ppo
  - opd

# Override per run via CLI --stages or a forked YAML.
stage_cfg:
  pretrain:
    max_steps: 10000
    streaming: true
  midtrain:
    max_steps: 5000
    lr: 1.5e-4
  long_context:
    seq_len: 2048
    max_steps: 2000
    batch_size: 2
  sft:
    max_steps: 3000
    lr: 1.0e-4
    max_len: 512
  reasoning:
    max_steps: 2000
    lr: 8.0e-5
  preference_bt:
    max_steps: 2000
    lr: 5.0e-5
  dpo:
    max_steps: 2000
    lr: 5.0e-5
    beta: 0.1
  orpo:
    max_steps: 2000
    lr: 5.0e-5
    beta: 0.1
  lora_pref:
    max_steps: 1500
    lr: 1.0e-4
    rank: 16
    alpha: 32.0
    beta: 0.1
    merge: true
  grpo:
    max_steps: 1500
    lr: 5.0e-5
    clip_eps: 0.2
  rlhf_ppo:
    max_steps: 1500
    lr: 3.0e-5
    clip_eps: 0.2
    kl_coef: 0.05
  opd:
    max_steps: 1500
    lr: 5.0e-5
    kl_weight: 0.5

# AERIS "decent assistant" target — d_model 512, ~1M+ tokens of real text.
# Needs a GPU for practical wall-clock time. CPU works only as a smoke test.
#
# Train (after data is ready):
#   PYTHONPATH=packages python scripts/train/train_company.py \
#     --preset large --tokenizer bpe --bpe-vocab 4000 \
#     --data data/decent/*.txt \
#     --steps 20000 --batch-size 8 --seq-len 512 --grad-accum 4 \
#     --lr 3e-4 --warmup 500 --cosine --dropout 0.1 \
#     --device cuda --bf16 --out checkpoints/AERIS_decent

model:
  d_model: 512
  d_k: 128
  d_v: 128
  n_skills: 12
  top_k: 3
  k_max: 4
  dendrite_window: 4
  max_seq_len: 1024
  dropout: 0.1
  # vocab from BPE train (~2k–8k for local; 32k if you use prepare_data)

training:
  batch_size: 8
  grad_accum_steps: 4
  seq_len: 512
  precision: "bf16"
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 20000
  device: "cuda"
  seed: 42

data:
  target_tokens: 1000000
  notes: >
    Prefer real chat / books / docs under a clear licence.
    Synthetic identity + honesty lines are only a seed, not the full 1M.

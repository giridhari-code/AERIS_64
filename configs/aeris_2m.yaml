# AERIS-2M — ~2.25M parameters + BPE vocab 8000
# Train (company standard):
#   PYTHONPATH=packages python scripts/data/prepare_data.py \
#     --input "data/pretrain_42m/en/*.txt" --out-dir data/tokens --vocab-size 8000
#   PYTHONPATH=packages python -m sentinel.cli train \
#     --config configs/aeris_2m.yaml --data-dir data/tokens \
#     --output-dir runs/AERIS_2m --precision bf16

model:
  d_model: 160
  d_k: 80
  d_v: 80
  n_skills: 8
  top_k: 2
  k_max: 4
  dendrite_window: 3
  vocab_size: 8000
  max_seq_len: 256
  tie_embeddings: true
  dropout: 0.05

tokenizer:
  type: bpe
  vocab_size: 8000
  sample_chars: 1000000

training:
  batch_size: 16
  seq_len: 256
  max_steps: 6000
  lr: 3.0e-3
  device: "cuda"

data:
  target_words_now: 2400000

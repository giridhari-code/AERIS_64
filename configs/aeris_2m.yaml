# AERIS-2M — ~2.3M parameters for ~2–2.5M word first corpus
# Measured: d_model=160, vocab=8000, tied embeddings → ~2.25M params
#
# Train on current data/pretrain_42m (~24 lakh words):
#   PYTHONPATH=packages python scripts/train/train_company.py \
#     --preset aeris_2m --tokenizer bpe --bpe-vocab 8000 \
#     --data data/pretrain_42m/en \
#     --steps 6000 --batch-size 16 --seq-len 256 --grad-accum 2 \
#     --lr 3e-3 --warmup 200 --cosine --device cuda --bf16 \
#     --out checkpoints/AERIS_2m --product AERIS_2m

model:
  d_model: 160
  d_k: 80
  d_v: 80
  n_skills: 8
  top_k: 2
  k_max: 4
  dendrite_window: 3
  vocab_size: 8000
  max_seq_len: 256
  tie_embeddings: true
  dropout: 0.05

training:
  batch_size: 16
  seq_len: 256
  max_steps: 6000
  lr: 3.0e-3
  device: "cuda"

data:
  target_words_now: 2400000
  notes: First train on ~2.4M real words; scale to aeris_42m when data is 50M–200M+.

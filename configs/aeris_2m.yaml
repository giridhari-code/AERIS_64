# AERIS-2M — ~2.25M parameters + BPE vocab 8000
# Train:
#   PYTHONPATH=packages python scripts/train/train_company.py \
#     --preset aeris_2m --tokenizer bpe --bpe-vocab 8000 --bpe-sample-chars 1000000 \
#     --data data/pretrain_42m/en \
#     --steps 6000 --batch-size 16 --seq-len 256 --grad-accum 2 \
#     --lr 3e-3 --warmup 200 --cosine --device cuda --bf16 \
#     --out checkpoints/AERIS_2m --product AERIS_2m

model:
  d_model: 160
  d_k: 80
  d_v: 80
  n_skills: 8
  top_k: 2
  k_max: 4
  dendrite_window: 3
  vocab_size: 8000
  max_seq_len: 256
  tie_embeddings: true
  dropout: 0.05

tokenizer:
  type: bpe
  vocab_size: 8000
  sample_chars: 1000000

training:
  batch_size: 16
  seq_len: 256
  max_steps: 6000
  lr: 3.0e-3
  device: "cuda"

data:
  target_words_now: 2400000

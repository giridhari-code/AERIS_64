[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofield"
version = "2.3.1"
description = "NeuroField / AESC: two-speed memory architecture (v2.3)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}   # custom source-available, non-commercial (NOT MIT)
authors = [{name = "Giridhari Karmakar", email = "giriisdev@gmail.com"}]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "safetensors>=0.4.0",
    "torch>=2.1.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "build>=1.0",
    "httpx>=0.26",
]
data = [
    "tokenizers>=0.15",
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.26",
]
sdk = [
    "httpx>=0.26",
]
all = [
    "neurofield[dev,serve,data,sdk]",
]

[project.scripts]
neurofield-train = "neurofield.cli:train_main"
neurofield-eval  = "neurofield.cli:eval_main"

[tool.setuptools.package-data]
neurofield = ["serving/static/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neurofield*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

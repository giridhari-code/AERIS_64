[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofield"
version = "2.2.0"
description = "NeuroField: two-speed memory architecture (AERIS 1B recipe)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NeuroField Contributors"}]
dependencies = [
    "safetensors>=0.4.0",
    "torch>=2.1.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "build>=1.0",
    "httpx>=0.26",
]
data = [
    "tokenizers>=0.15",
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]
all = [
    "neurofield[dev,serve,data]",
]

[project.scripts]
neurofield-train = "neurofield.cli:train_main"
neurofield-eval  = "neurofield.cli:eval_main"

[tool.setuptools.package-data]
neurofield = ["serving/static/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neurofield*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

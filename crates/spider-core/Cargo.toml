[package]
name = "spider-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Spider-Web Looped MoE — personal-scale LLM core (AERIS_64)"
authors = ["Giridhari Karmakar <giriisdev@gmail.com>"]
license = "MIT"

[dependencies]
# CPU prototype tensors; swap/extend for candle-nn CUDA later
ndarray = "0.16"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
